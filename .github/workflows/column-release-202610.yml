name: REVIA October 2026 column release

on:
  schedule:
    # UTC: JST 07:00, 07:07, 07:17, 07:37; followed by bounded retries.
    # Cron has no year field; the Python gate strictly enforces 2026.
    - cron: '0,7,17,37 22 19,21,23,26,28,30 10 *'
    - cron: '7,37 23 19,21,23,26,28,30 10 *'
    - cron: '17 3,9,14 20,22,24,27,29,31 10 *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Publish due approved articles, or verify existing URLs only'
        type: choice
        options: [verify, publish]
        default: verify

permissions:
  contents: read

concurrency:
  group: revia-october-2026-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write # Retire this workflow after all six URLs verify successfully.
    env:
      REVIA_PUBLISH_202610_ENABLED: ${{ vars.REVIA_PUBLISH_202610_ENABLED }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Check real clock, campaign year and activation
        id: gate
        run: python3 scripts/column_release.py gate
      - name: Validate due approved packages and prepare one release
        id: prepare
        if: steps.gate.outputs.allowed == 'true' && (github.event_name == 'schedule' || inputs.mode == 'publish')
        env:
          REVIA_BUNDLE_KEY: ${{ secrets.REVIA_BUNDLE_KEY }}
          REVIA_ARTICLE_20261020: ${{ secrets.REVIA_ARTICLE_20261020 }}
          REVIA_ARTICLE_20261022: ${{ secrets.REVIA_ARTICLE_20261022 }}
          REVIA_ARTICLE_20261024: ${{ secrets.REVIA_ARTICLE_20261024 }}
          REVIA_ARTICLE_20261027: ${{ secrets.REVIA_ARTICLE_20261027 }}
          REVIA_ARTICLE_20261029: ${{ secrets.REVIA_ARTICLE_20261029 }}
          REVIA_ARTICLE_20261031: ${{ secrets.REVIA_ARTICLE_20261031 }}
        run: python3 scripts/column_release.py prepare --apply
      - name: Configure narrowly scoped repository publishing credential
        if: steps.prepare.outputs.changed == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.REVIA_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -eu
          test -n "$RELEASE_TOKEN"
          auth=$(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
      - name: Push one complete release without overwriting concurrent edits
        if: steps.prepare.outputs.changed == 'true'
        env:
          REVIA_RELEASE_AUTHOR_NAME: ${{ vars.REVIA_RELEASE_AUTHOR_NAME }}
          REVIA_RELEASE_AUTHOR_EMAIL: ${{ vars.REVIA_RELEASE_AUTHOR_EMAIL }}
        run: python3 scripts/commit_column_release.py
      - name: Remove publishing credential
        if: always()
        run: git config --local --unset-all http.https://github.com/.extraheader || true
      - name: Verify actual production URLs, article hashes and navigation
        if: (steps.prepare.outcome == 'success' && steps.prepare.outputs.published != '0') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify')
        run: python3 scripts/column_release.py verify --attempts 16
      - name: Report missing representative-approved packages
        if: steps.prepare.outputs.missing == 'true'
        run: |
          echo 'Missing approved packages. Review the safe missing_slots list above. No unapproved article was published.'
          exit 1
      - name: Disable this finite workflow after all six articles verify
        if: steps.prepare.outputs.published == '6'
        env:
          GH_RETIRE_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, sys, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY'] + '/actions/workflows/column-release-202610.yml/disable'
          request = urllib.request.Request(url, method='PUT', headers={
              'Authorization': 'Bearer ' + os.environ['GH_RETIRE_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 204:
                      raise RuntimeError()
              print('CAMPAIGN_WORKFLOW_DISABLED_AFTER_SIX_VERIFIED_URLS')
          except Exception:
              print('RETIREMENT_FAILED: disable the workflow manually; the fixed six-slot and November cutoff guards remain active.')
              sys.exit(1)
          PY
      - name: Explain inactive campaign
        if: steps.gate.outputs.allowed != 'true' && inputs.mode != 'verify'
        run: echo 'No publishing allowed outside the campaign window or without representative activation.'
